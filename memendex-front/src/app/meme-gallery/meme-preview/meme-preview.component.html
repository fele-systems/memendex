<div class="card h-100" (click)="onSelectMeme()">
  <div class="image-container ">
    @if (hasThumbnail()) {
      <img
        class="card-img-top"
        src="/api/memes/{{ meme.id }}/thumbnail"
        alt="{{ meme.description }}"
        title="{{ meme.description }}"
      />
    } @else {
      <span class="card-img-top fiv-cla fiv-icon-{{ memeIconExtension() }}"></span>
    }
  </div>
  <hr>
  <div class="card-body">
    <h6 class="card-title">{{ meme.fileName }}</h6>
  </div>
</div>
