<form (ngSubmit)="submit()" class="d-flex" role="search">
    <input
      placeholder="Query"
      class="form-control me-2"
      type="search"
      name="query"
      [formControl]="query"
      (input)="onInput($event)"
    />
    <input class="btn btn-outline-success" type="submit" value="Search!" />
</form>
